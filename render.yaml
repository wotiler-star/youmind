# Render 一键部署配置
# 用法：在 Render 控制台选择 "New" -> "Blueprint" -> 关联本仓库，Render 会按此文件创建两个服务。
services:
  - type: web
    name: youmind-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        value: sqlite:////app/data/youmind.db
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: DEFAULT_MODEL
        value: openrouter/google/gemini-3-pro-preview
      - key: CORS_ALLOW_ORIGINS
        value: "*"

  - type: web
    name: youmind-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      # 前端 nginx 反代到后端（Render 自动注入后端公开地址）
      - key: BACKEND_URL
        fromService:
          name: youmind-backend
          type: URL
